<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="orangeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D94400" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="orangeRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
